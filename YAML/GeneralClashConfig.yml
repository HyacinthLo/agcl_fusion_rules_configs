#---------------------------------------------------#
## 配置文件需要放置在 $HOME/.config/clash/config.yml
## 或者运行目录下的config.yml
#---------------------------------------------------#

# 混合端口 HTTP和SOCKS5用一个端口
mixed-port: 17890

# HTTP 代理端口
# port: 17890

# SOCKS5 代理端口
# socks-port: 17891

# Linux 和 macOS 的 redir 代理端口 (如需使用此功能，请取消注释)
redir-port: 17892

# 允许局域网的连接（可用来共享代理）
allow-lan: false

# 仅在将allow-lan设置为true时适用
# #"*": 绑定所有IP地址
# #192.168.122.11: 绑定单个IPv4地址
# #"[aaaa::a8aa:ff:fe09:57d8]": 绑定单个IPv6地址
# bind-address: "*"

# 规则模式：Rule（规则） / Global（全局代理）/ Direct（全局直连）
mode: Rule

# 设置日志输出级别 (默认级别：silent，即不输出任何内容，以避免因日志内容过大而导致程序内存溢出）。
# 5 个级别：silent / error / warning / info / debug。级别越高日志输出量越大，越倾向于调试，若需要请自行开启。
log-level: info

# Clash 的 RESTful API
external-controller: '127.0.0.1:9090'

# 您可以将静态网页资源（如 clash-dashboard）放置在一个目录中，clash 将会服务于 `RESTful API/ui`
# 参数应填写配置目录的相对路径或绝对路径。
# http://127.0.0.1:9090/ui/#/
# external-ui: folder
# yacd面板：  https://github.com/haishanh/yacd
# Razord面板：http://clash.razord.top/#/proxies
# external-ui: dashboard

# RESTful API 的口令 (可选)
# secret: ""

ipv6: true

sniffer:
  sniff:
    TLS: {ports: [443], override-destination: true}
    HTTP: {ports: [443], override-destination: true}
  enable: true
  parse-pure-ip: false
  force-dns-mapping: true
  override-destination: true

# 实验性功能
experimental:
  sniff-tls-sni: true
  ignore-resolve-fail: true # 忽略 DNS 解析失败，默认值为 true
  # interface-name: en0 # outbound interface name

# 本地 SOCKS5 / HTTP(S) 服务认证
# authentication:
#  - "user1:pass1"
#  - "user2:pass2"

# 实验性功能 hosts, 支持通配符 (例如 *.clash.dev 甚至 *.foo.*.example.com)
# 静态的域名 比 通配域名 具有更高的优先级 (foo.example.com 优先于 *.example.com)
# 注意: hosts 在 fake-ip 模式下不生效
#hosts:
#   '*.clash.dev': 127.0.0.1
#   'alpha.clash.dev': '::1'
dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: true
  use-hosts: true
  use-system-hosts: true
  listen: 0.0.0.0:10053
  ipv6: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - "2402:4e00::"
    - "2400:3200::1"
    - tls://119.29.29.29
    - tls://223.5.5.5
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - "2402:4e00::"
    - "2400:3200::1"
    - tls://119.29.29.29
    - tls://223.5.5.5
    - tls://dot.pub:853
    - tls://dns.alidns.com:853
    - https://dns.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
    - https://dns.opendns.com/dns-query
    - https://dns.quad9.net/dns-query
    - tls://dns.google:853
    - tls://one.one.one.one:853
    - tls://dns.opendns.com:853
    - tls://dns.quad9.net:853
    - tls://8.8.4.4
    - tls://1.1.1.1
  proxy-server-nameserver:
    - udp://0.0.0.0:10053
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - "2402:4e00::"
    - "2400:3200::1"
  direct-nameserver-follow-policy: false
  
  nameserver-policy:
    '+.arpa': '10.0.0.1'
    "geosite:cn,private":
    - tls://119.29.29.29
    - tls://223.5.5.5
    - tls://dot.pub:853
    - tls://dns.alidns.com:853
    - https://dns.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
    # domain:
    #   - '+.google.com'
    #   - '+.facebook.com'
    #   - '+.youtube.com'
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/15
  fake-ip-filter:
